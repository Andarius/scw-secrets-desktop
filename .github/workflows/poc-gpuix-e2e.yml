name: POC gpuix e2e

on:
  pull_request:
    paths:
      - "poc/gpuix/**"
      - ".github/workflows/poc-gpuix-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    # the gpuix renderer needs glibc 2.39
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Setup Rust
        working-directory: poc/gpuix/native
        run: rustup toolchain install --profile minimal

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: poc/gpuix/native

      - name: Install headless compositor and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kwin-wayland mesa-vulkan-drivers libvulkan1 libxkbcommon0 dbus

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd poc/gpuix && bun install --frozen-lockfile

      - name: Build the Rust addon
        working-directory: poc/gpuix
        run: bun run native

      - name: Run e2e in a virtual KWin
        working-directory: poc/gpuix
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          SCW_GPUIX_SAMPLE: "1"
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$(mktemp -d)}"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -c '
            kwin_wayland --virtual --no-lockscreen --socket wayland-e2e --width 1280 --height 800 > kwin.log 2>&1 &
            for _ in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/wayland-e2e" ] && break; sleep 0.2; done
            env -u DISPLAY WAYLAND_DISPLAY=wayland-e2e timeout 300 bun e2e.ts
          '

      - name: Upload KWin log on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kwin-log
          path: poc/gpuix/kwin.log
          if-no-files-found: ignore
