name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.3"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            tag="${tag#refs/tags/}"
            if [[ "${tag}" != v* ]]; then
              tag="v${tag}"
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ -z "${tag}" ]]; then
            echo "Release tag is required" >&2
            exit 1
          fi

          git fetch --tags --force
          git rev-parse "${tag}^{commit}" >/dev/null
          echo "value=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        run: git checkout "${{ steps.tag.outputs.value }}"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          expected_tag="v$(bun -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); console.log(pkg.version);')"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${expected_tag}" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists"
          else
            gh release create "${RELEASE_TAG}" --repo "${GH_REPO}" --draft --generate-notes --title "${RELEASE_TAG}"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            bundle: bundle
          - runner: windows-latest
            target: win-x64
            bundle: bundle:msi
          - runner: macos-latest
            target: macos-arm64
            bundle: bundle:mac
          - runner: macos-15-intel
            target: macos-x64
            bundle: bundle:mac
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.3"

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend and embed assets
        run: bun run build && deno task embed

      - name: Build desktop bundle
        run: deno task ${{ matrix.bundle }}

      - name: Package macOS app
        if: runner.os == 'macOS'
        # zipped .app instead of hdiutil DMG — hdiutil is flaky on GitHub runners
        run: |
          ditto -c -k --keepParent build/macos/ScwSecrets.app "build/macos/ScwSecrets-${{ matrix.target }}.app.zip"
          rm -rf build/macos/ScwSecrets.app

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun run ./scripts/upload-release-assets.ts

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-artifacts-${{ matrix.target }}
          path: build
          if-no-files-found: ignore

  snap:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.3"

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop dir bundle
        run: bun run build && deno task embed && deno task bundle:dir

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        id: snapcraft
        # destructive mode: base core24 matches the ubuntu-24.04 runner, no LXD needed
        run: |
          snapcraft pack --destructive-mode --verbosity=error
          echo "snap=$(ls scw-secrets_*.snap)" >> "${GITHUB_OUTPUT}"

      - name: Upload snap to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${RELEASE_TAG}" "${{ steps.snapcraft.outputs.snap }}" --repo "${GH_REPO}" --clobber

  publish:
    needs:
      - prepare
      - build
      - snap
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --repo "${GH_REPO}" --draft=false
