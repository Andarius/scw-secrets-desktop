name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.3"

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
            tag="${tag#refs/tags/}"
            if [[ "${tag}" != v* ]]; then
              tag="v${tag}"
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a version such as v1.2.3" >&2
            exit 1
          fi

          git fetch --tags --force
          git rev-parse "${tag}^{commit}" >/dev/null
          echo "value=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          expected_tag="v$(bun -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); console.log(pkg.version);')"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${expected_tag}" >&2
            exit 1
          fi
          cargo_tag="v$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)"
          if [ "${RELEASE_TAG}" != "${cargo_tag}" ]; then
            echo "Tag ${RELEASE_TAG} does not match src-tauri/Cargo.toml version ${cargo_tag}" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          awk -v v="${RELEASE_TAG#v}" '$0 ~ "^## " v " " {f=1; next} f && /^## / {exit} f' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no entry for ${RELEASE_TAG} — refusing to release" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists"
          else
            gh release create "${RELEASE_TAG}" --repo "${GH_REPO}" --draft --notes-file RELEASE_NOTES.md --title "${RELEASE_TAG}"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            bundle: appimage
          - runner: windows-latest
            target: win-x64
            bundle: msi
          - runner: macos-latest
            target: macos-arm64
            bundle: app
          - runner: macos-15-intel
            target: macos-x64
            bundle: app
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.3"

      - name: Setup Rust
        run: rustup toolchain install --profile minimal

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop bundle
        run: bun run tauri build --bundles ${{ matrix.bundle }} -- --locked

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/ScwSecrets.app "src-tauri/target/release/bundle/macos/ScwSecrets-${{ matrix.target }}.app.zip"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun run ./scripts/upload-release-assets.ts

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-artifacts-${{ matrix.target }}
          path: src-tauri/target/release/bundle
          if-no-files-found: ignore

  snap:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.3"

      - name: Setup Rust
        run: rustup toolchain install --profile minimal

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stage desktop binary
        run: |
          bun run tauri build --no-bundle -- --locked
          mkdir -p build/linux/scw-secrets
          cp src-tauri/target/release/scw-secrets build/linux/scw-secrets/
          cp icon.png build/linux/scw-secrets/AppIcon.png

      - name: Build snap
        id: snapcraft
        # official snapcraft OCI image — the docs-recommended CI path (snapcore/action-build is unmaintained, node20)
        run: |
          docker run --rm -v "${PWD}:/project" ghcr.io/canonical/snapcraft:8_core24 pack
          echo "snap=$(ls scw-secrets_*.snap)" >> "${GITHUB_OUTPUT}"

      - name: Upload snap to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
        run: gh release upload "${RELEASE_TAG}" "${SNAP_FILE}" --repo "${GH_REPO}" --clobber

  publish:
    needs:
      - prepare
      - build
      - snap
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --repo "${GH_REPO}" --draft=false
