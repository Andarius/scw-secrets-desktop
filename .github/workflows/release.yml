name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.3"

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
            tag="${tag#refs/tags/}"
            if [[ "${tag}" != v* ]]; then
              tag="v${tag}"
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a version such as v1.2.3" >&2
            exit 1
          fi

          git fetch --tags --force
          git rev-parse "${tag}^{commit}" >/dev/null
          echo "value=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          expected_tag="v$(bun -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); console.log(pkg.version);')"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${expected_tag}" >&2
            exit 1
          fi
          cargo_tag="v$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)"
          if [ "${RELEASE_TAG}" != "${cargo_tag}" ]; then
            echo "Tag ${RELEASE_TAG} does not match src-tauri/Cargo.toml version ${cargo_tag}" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          awk -v v="${RELEASE_TAG#v}" '$0 ~ "^## " v " " {f=1; next} f && /^## / {exit} f' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no entry for ${RELEASE_TAG} — refusing to release" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists"
          else
            gh release create "${RELEASE_TAG}" --repo "${GH_REPO}" --draft --notes-file RELEASE_NOTES.md --title "${RELEASE_TAG}"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            bundle: appimage
          - runner: windows-latest
            target: win-x64
            bundle: msi
          - runner: macos-latest
            target: macos-arm64
            bundle: app
          - runner: macos-15-intel
            target: macos-x64
            bundle: app
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.3"

      - name: Setup Rust
        run: rustup toolchain install --profile minimal

      # Tag runs can't reuse another tag's cache; warm-release-cache.yml saves it from master.
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.target }}
          save-if: false

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tauri build signs and notarizes the .app when these are set; skipped until the Apple secrets exist
      - name: Enable macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE}" ]]; then
            echo "::warning::APPLE_CERTIFICATE is not set; the macOS bundle ships unsigned and unnotarized"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "${name} is not set" >&2
              exit 1
            fi
            delimiter="EOF_$(uuidgen)"
            printf '%s<<%s\n%s\n%s\n' "${name}" "${delimiter}" "${!name}" "${delimiter}" >> "${GITHUB_ENV}"
          done

      - name: Build desktop bundle
        run: bun run tauri build --bundles ${{ matrix.bundle }} -- --locked

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/ScwSecrets.app "src-tauri/target/release/bundle/macos/ScwSecrets-${{ matrix.target }}.app.zip"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun run ./scripts/upload-release-assets.ts

      - name: Keep release assets for signing
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-assets-${{ matrix.target }}
          path: .release-assets
          if-no-files-found: error

      - name: Upload Linux binary for the snap
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-binary
          path: src-tauri/target/release/scw-secrets
          if-no-files-found: error

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-artifacts-${{ matrix.target }}
          path: src-tauri/target/release/bundle
          if-no-files-found: ignore

  snap:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download Linux binary
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: linux-binary
          path: build/linux/scw-secrets

      - name: Stage desktop binary
        run: |
          chmod +x build/linux/scw-secrets/scw-secrets
          cp icon.png build/linux/scw-secrets/AppIcon.png

      - name: Build snap
        id: snapcraft
        # official snapcraft OCI image — the docs-recommended CI path (snapcore/action-build is unmaintained, node20)
        run: |
          docker run --rm -v "${PWD}:/project" ghcr.io/canonical/snapcraft:8_core24@sha256:0443273552768a3230c2ede3aa47e567da0242bfbb0a7bb1283093208c404a0c pack
          echo "snap=$(ls scw-secrets_*.snap)" >> "${GITHUB_OUTPUT}"

      - name: Upload snap to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
        run: gh release upload "${RELEASE_TAG}" "${SNAP_FILE}" --repo "${GH_REPO}" --clobber

      - name: Keep the snap for signing
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-assets-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  sign:
    needs:
      - prepare
      - build
      - snap
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # sign this run's build outputs, not the mutable draft release
      - name: Download release assets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: release-assets-*
          path: assets
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update && sudo apt-get install -y minisign

      # the updater and install scripts only accept assets signed with this key, for this tag and file name
      - name: Sign release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY}" ]]; then
            echo "UPDATE_SIGNING_KEY secret is not set" >&2
            exit 1
          fi
          key="${RUNNER_TEMP}/update-signing.key"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${SIGNING_KEY}" > "${key}")
          cd assets
          for file in *; do
            minisign -S -s "${key}" -m "${file}" -t "scw-secrets ${RELEASE_TAG} ${file}"
          done
          minisign -V -p ../src-tauri/update-signing.pub -m "${file}"
          gh release upload "${RELEASE_TAG}" --repo "${GH_REPO}" ./*.minisig --clobber

  publish:
    needs:
      - prepare
      - build
      - snap
      - sign
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --repo "${GH_REPO}" --draft=false
