name: scw-secrets
adopt-info: scw-secrets
summary: Desktop UI for managing Scaleway secrets
description: |
  A desktop client for Scaleway Secret Manager built with Deno desktop,
  React, and TypeScript.
license: MIT
grade: stable
confinement: classic
base: core24
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  scw-secrets:
    command: opt/scw-secrets/scw-secrets

parts:
  scw-secrets:
    plugin: dump
    # Prebuilt by CI (deno task bundle:dir) before snapcraft runs — see release.yml
    source: build/linux/scw-secrets
    override-pull: |
      craftctl default
      version="$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' "${CRAFT_PROJECT_DIR}/package.json" | head -n1)"
      craftctl set version="${version}"
    organize:
      "*": opt/scw-secrets/
    stage-packages:
      - libwebkit2gtk-4.1-0
