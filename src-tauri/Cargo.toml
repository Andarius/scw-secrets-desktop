[package]
name = "scw-secrets"
version = "0.12.0"
description = "Desktop client for Scaleway Secret Manager"
authors = ["Scw Secrets contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-clipboard-manager = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "net", "macros", "rt-multi-thread", "process", "time", "sync"] }
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = "0.3.34"
minisign-verify = "0.2"
sha2 = "0.11.1"
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.20"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
# Allowed pedantic lints
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
used_underscore_binding = "allow"
if_not_else = "allow"
large_stack_arrays = "allow"
# Disallowed restriction lints
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
use_self = "warn"
